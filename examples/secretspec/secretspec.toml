# Reads GitHub tokens through OpenBao with secretspec. See README.md.
[project]
name = "openbao-authorizer-example"
revision = "1.0"

[providers]
# kv=1 makes the provider do a plain read of <mount>/<item>, which also works
# for dynamic paths such as github/token/<permission-set>. The address comes
# from BAO_ADDR and the token from BAO_TOKEN (or VAULT_*).
github = "openbao:///github?kv=1"
keyring = "keyring://secretspec/cache/{project}/{profile}/{key}"
# GitHub installation tokens live one hour from the read; max_age stays below
# that so a cached token never outlives the real one, with room for the command.
github_cached = { fallback = ["github"], cache = { provider = "keyring", max_age = "45m" } }

# Every read mints a new token and needs the caller's own Grant. Use this for
# agents, so their access still depends on their identity's approval.
[profiles.default]
GH_TOKEN = { description = "GitHub installation token for the project-authorizer permission set", ref = { item = "token/project-authorizer", field = "token" }, providers = ["github"] }

# Reuses the token from your keyring for up to 45 minutes. The keyring is
# shared by everything running as you, whatever its identity, so use it only
# for your own commands.
[profiles.cached]
GH_TOKEN = { description = "GitHub installation token for the project-authorizer permission set", ref = { item = "token/project-authorizer", field = "token" }, providers = ["github_cached"] }
