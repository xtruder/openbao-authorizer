syntax = "proto3";

package openbao.authorizer.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// ItemState is the lifecycle of one Permission Item.
enum ItemState {
  ITEM_STATE_UNSPECIFIED = 0;
  // Waiting for an Approver.
  ITEM_STATE_PENDING = 1;
  // OpenBao already allowed the capabilities when the item was filed.
  ITEM_STATE_ALREADY_GRANTED = 2;
  // Approved; a Grant is or was in effect.
  ITEM_STATE_APPROVED = 3;
  // Rejected by an Approver.
  ITEM_STATE_REJECTED = 4;
  // Refused by the authorizer before or at decision time; see the item reason.
  ITEM_STATE_REFUSED = 5;
  // Nobody decided the item before its pending deadline.
  ITEM_STATE_EXPIRED = 6;
  // An Approver revoked the Grant before its expiry.
  ITEM_STATE_REVOKED = 7;
}

// Scope decides which tokens a Grant reaches.
enum Scope {
  // Requests: the Requester's default scope. Decisions: keep the item's scope.
  SCOPE_UNSPECIFIED = 0;
  // The Requester's own identity: one agent session, or one non-project
  // Requester such as a CI AppRole.
  SCOPE_SESSION = 1;
  // Every token of the Requester's project: its Named Token and all sessions.
  SCOPE_PROJECT = 2;
  // Every project and session token on the server: default Grants.
  SCOPE_GLOBAL = 3;
}

// PermissionItem is one OpenBao path plus capabilities within a Grant Request.
message PermissionItem {
  string id = 1;
  string path = 2;
  repeated string capabilities = 3;
  // Resolved Grant lifetime; unset for refused items.
  google.protobuf.Duration ttl = 4;
  ItemState state = 5;
  // Why the item was refused, when it was.
  string reason = 6;
  // Pending deadline for pending items; Grant expiry for approved and revoked items.
  google.protobuf.Timestamp expires_at = 7;
  // Approver display name; only on the approver API.
  string decided_by = 8;
  google.protobuf.Timestamp decided_at = 9;
  // Only on the approver API.
  string grant_id = 10;
  // Requested scope, or the decided one once approved.
  Scope scope = 11;
}

// Requester describes who filed a request, for Approvers.
message Requester {
  // Session ID or Named Identity from token metadata, or the token's display name.
  string id = 1;
  string title = 2;
  string directory = 3;
  string entity_id = 4;
  // Name of the Requester Rule the token matched.
  string rule = 5;
  // Project whose project-scope policy the token carries; empty for none.
  string project = 6;
  // Agent session ID from token metadata; empty for project and other tokens.
  string session = 7;
  // Scopes a Grant for this Requester may take, the default first.
  repeated Scope scopes = 8;
}

// GrantRequest is a batch of Permission Items one Requester asked for at once.
message GrantRequest {
  string id = 1;
  string reason = 2;
  google.protobuf.Timestamp created_at = 3;
  // Only on the approver API.
  Requester requester = 4;
  repeated PermissionItem items = 5;
}

// Grant is an approved Permission Item in effect for a Requester.
message Grant {
  string id = 1;
  string item_id = 2;
  string path = 3;
  repeated string capabilities = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  // Only on the approver API.
  string approved_by = 7;
  // Only on the approver API.
  Requester requester = 8;
  Scope scope = 9;
  // Project of a project-scope Grant.
  string project = 10;
}

// Heartbeat keeps idle streams alive through proxies; clients ignore it.
message Heartbeat {}

// ErrorDetail is attached to RPC errors so clients can branch on a stable reason.
message ErrorDetail {
  // Stable machine-readable reason, e.g. "ITEM_NOT_PENDING", "NOT_REQUESTER"
  // or "SELF_APPROVAL".
  string reason = 1;
  // IDs of the items or grants the error concerns, when relevant.
  repeated string ids = 2;
}

// Grantable is one Grantable Rule as Requesters and Approvers see it.
message Grantable {
  string name = 1;
  // OpenBao ACL path pattern: `+` matches one segment, a trailing `*` any suffix.
  string path = 2;
  repeated string capabilities = 3;
  // Longest Grant the rule allows (default_ttl when the rule sets none).
  google.protobuf.Duration max_ttl = 4;
  // Operator-written hint on what the rule is for and how to pick a path.
  string description = 5;
  // Concrete requestable paths found by listing the rule's discover path;
  // empty when the rule has none. Other paths matching `path` stay valid.
  repeated string paths = 6;
  // Set when listing the discover path failed; `path` still applies.
  string discover_error = 7;
}
