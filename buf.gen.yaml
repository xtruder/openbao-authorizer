version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/xtruder/openbao-authorizer/gen/go
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.21.0
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.16.0
    out: web/src/gen
    opt: target=ts
inputs:
  - directory: proto
