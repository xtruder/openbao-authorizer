name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true

      - name: Lint, format and generated-code drift
        run: make proto-check

      - name: Breaking changes against main
        if: github.event_name == 'pull_request'
        # Skip until main carries a buf module to compare against.
        run: |
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            buf breaking --against '.git#branch=origin/main'
          else
            echo "origin/main has no buf.yaml; skipping breaking-change check"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - id: node-modules
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('web/package.json', 'web/package-lock.json') }}

      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix web

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - id: node-modules
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('web/package.json', 'web/package-lock.json') }}

      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix web

      - uses: oven-sh/setup-bun@v2

      - name: Unit tests
        run: make test

      - name: opencode plugin tests
        run: make opencode-plugin-test

      - name: End-to-end tests
        run: make e2e

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - id: node-modules
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('web/package.json', 'web/package-lock.json') }}

      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix web

      - run: make bin/openbao-authorizer bin/bao-cred

      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-web-dist
          path: web/dist
          if-no-files-found: error

  release-binaries:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-web-dist
          path: web/dist

      - name: Build and upload release binary
        uses: wangyoucao577/go-release-action@v1.55
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: go.mod
          project_path: ./cmd/openbao-authorizer ./cmd/bao-cred
          binary_name: openbao-authorizer
          pre_command: export CGO_ENABLED=0
          build_flags: -trimpath
          ldflags: -s -w
          md5sum: false
          sha256sum: false
          release_tag: ${{ github.ref_name }}
          overwrite: true
          asset_name: openbao-authorizer-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          compress_assets: auto
          multi_binaries: true

      # sha256sum format ("<hash>  <file>"): Renovate maps the file name to the
      # next release's archive. A bare hash makes it hash the .sha256 file
      # itself, which put wrong checksums into the Homebrew formula.
      - name: Upload checksum
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: openbao-authorizer-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern "$ASSET" --dir checksum
          (cd checksum && sha256sum "$ASSET" > "$ASSET.sha256")
          gh release upload "$GITHUB_REF_NAME" "checksum/$ASSET.sha256" --clobber

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
